<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Memories</title>
    <link rel="stylesheet" href="4th.css">
</head>
<body class="page-4-body">

    <div class="gallery-wrapper">
        <header class="gallery-header">
            <h1>Some Memorable Moments</h1>
        </header>

        <!-- The grid where gift boxes will be generated -->
        <div id="gallery-grid" class="gallery-grid"></div>
    </div>

    <!-- The Modal (Pop-up) inspired by image_757ab7.png -->
    <div id="memory-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="modal-left">
                <img id="modal-img" src="" alt="Memory Image">
            </div>
            <div class="modal-right">
                <h2>Memories</h2>
                <hr>
                <p id="modal-desc"></p>
            </div>
        </div>
    </div>

    <div id="music-container" style="position: fixed; top: 20px; right: 20px; z-index: 1000;">
    <button id="musicBtn" onclick="toggleMusic()" style="background: rgba(255,255,255,0.7); border-radius: 50%; padding: 10px; border: none; cursor: pointer; font-size: 20px;">
        🎵
    </button>
    <audio id="bgMusic" loop>
        <source src="https://res.cloudinary.com/daoqcumqm/video/upload/v1779219233/Bairan_Animated_Love_Story___Banjaare_Official_Video_oafxkMv4xnc_ajdf4b.mp3" type="audio/mpeg">
    </audio>
</div>

    <button class="final-btn">Final Surprise →</button>

    <script src="4th.js"></script>
</body>
</html>
